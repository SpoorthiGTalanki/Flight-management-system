<!DOCTYPE html>
<html>
<head>
    <title>Google Login Test</title>
</head>
<body>

<h2>Google Login Test</h2>

<div id="g_id_onload"
     data-client_id="92274469042-idom1lfs8nhao9hbs4i6jofla6rpopqu.apps.googleusercontent.com"
     data-callback="handleCredentialResponse">
</div>

<div class="g_id_signin"></div>

<script src="https://accounts.google.com/gsi/client" async defer></script>

<script>
function handleCredentialResponse(response) {
    console.log("GOOGLE ID TOKEN:");
    console.log(response.credential);

    document.body.innerHTML += `
        <h3>Copy this ID Token:</h3>
        <textarea style="width:100%;height:200px">${response.credential}</textarea>
    `;
}
</script>

</body>
</html>
